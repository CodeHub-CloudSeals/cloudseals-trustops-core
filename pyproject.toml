[project]
name = "cloudseals-taad"
version = "1.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["packages/question-engine", "packages/reporting", "apps/assessment-api", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py39"
exclude = [".venv", "validate_registry.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"scripts/**" = ["E501", "E402"]
