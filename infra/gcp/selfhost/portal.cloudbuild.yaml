steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, infra/gcp/selfhost/Dockerfile.portal, --build-arg, 'BASE_IMAGE=${_BASE_IMAGE}', -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/taad/api:$BUILD_ID', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/taad/api:$BUILD_ID'
substitutions:
  _REGION: europe-west1
  _BASE_IMAGE: ''
serviceAccount: projects/$PROJECT_ID/serviceAccounts/taad-build@$PROJECT_ID.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
